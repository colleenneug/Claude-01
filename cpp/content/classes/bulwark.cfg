# BULWARK - AEGIS DOCTRINE.
# "They fed you a ship. Reclaimed plating, sintered into the long bones of
# your legs, and you have not felt cold since. Recovery Division sends a
# Bulwark through the door first because a Bulwark is the door."
name = BULWARK
role = AEGIS DOCTRINE
tagline = Armour grown from the hull of a dead ship. Walks first, always.
accent = 1.00, 0.71, 0.33

# The issued weapon. Owned from the moment the record is made, and free.
weapon = maul_12

# The field ability, on Q or E. See Game::useAbility.
ability = barrier
ability_name = AEGIS BARRIER
ability_desc = Overshield that soaks the next wave of fire.
ability_cooldown = 16

# The passive. A doctrine is its perk as much as its gun: this is what lets
# a Bulwark stand in a corridor and trade, and nothing else on the roster can.
perk_name = BULKHEAD PLATING
perk = Sealed armour absorbs 22% of all incoming damage.
hp = 124
damage_reduction = 0.22
