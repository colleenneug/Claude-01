# ARC LANCE, INDUCTION RIFLE - the Oracle's issued weapon.
# Charged induction bolts. Punches through a target and into whatever stood
# behind it, which is the Ghost in the Wire perk made mechanical.
name = ARC LANCE
damage = 26
pellets = 1
spread = 0.012
range = 90
pierce = true
headshot_multiplier = 2.2
fire_interval = 0.1875
reload_time = 2.0
mag_size = 24
reserve = 168
cost = 0
# What it looks like in your hands - see Game::collectViewmodel.
shape = induction

# Issued to one doctrine, and only to that one. It costs nothing because
# it is what a ORACLE carries; that is not the same as it being free.
class_required = oracle
