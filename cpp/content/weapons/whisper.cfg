# WHISPER, SUPPRESSED CARBINE - the Wraith's issued weapon.
# Subsonic and quiet. Triple damage on a head shot; the ark never hears the
# first one.
name = WHISPER
damage = 15
pellets = 1
spread = 0.020
range = 70
headshot_multiplier = 3.0
fire_interval = 0.094
reload_time = 1.7
mag_size = 32
reserve = 224
cost = 0
# What it looks like in your hands - see Game::collectViewmodel.
shape = carbine

# Issued to one doctrine, and only to that one. It costs nothing because
# it is what a WRAITH carries; that is not the same as it being free.
class_required = wraith
