# SCARAB — Cyber-manufactured spider-drone, built on Shipmind blueprints.
# Fast, fragile, and fielded in swarms. Six articulated legs fold flat for
# transit; a single red optic tracks motion. The Cybers stamp them out of
# scrap iron and Shipmind circuitry — cheap to make, cheap to lose.
name = Scarab
hp = 55
speed = 3.6
damage = 7
attack_range = 2.0
# Five of these in contact at 0.95s was ~42 damage a second against 100 HP
# — a swarm you cannot out-shoot. At 1.25s it is still the fastest thing in
# the game and still lethal if you let it surround you.
attack_rate = 1.25
radius = 0.42
height = 1.5
colour = 0.54, 0.18, 0.18
glow = 1.0, 0.25, 0.22
ranged = false
xp = 18

# The Scarab hovers on a belly thruster — it gets the flyer body (a core
# in a cowl with a spinning ring and a thruster) rather than legs.
flying = true
