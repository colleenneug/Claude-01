# VOSS, QUARTERMASTER. The same Elias Voss whose name is on the Cradle's
# comms thread forty years and eleven light-years from here - or someone who
# took it. The station does not ask.
#
# `shop = gear` is what makes this one a vendor rather than a conversation:
# talking to Voss opens the armoury.
name = VOSS
title = QUARTERMASTER
line = Gear, parts, and the bench.
colour = 1.00, 0.71, 0.33
# Where he stands and which way he faces (degrees, 0 looks down +X).
position = -37, 7, 2
facing = -90
shop = gear
desk = true

say | You want something that will still be working when the shooting stops.
say | Everything on this bench came off something that stopped working.
say | I rebuild what comes back. Not everything comes back.
say | Take the plating. You will not thank me until the first corridor.
