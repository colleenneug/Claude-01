# The Strider ladder. One file per rank; the ladder is ordered by `xp`, so
# inserting a rank between two others is a file with an xp figure between
# theirs and nothing else to keep in step.
#
# `stipend` is paid once, on promotion. `unlock` is one line of what the rank
# opens up — gear files name the same rank in `rank_required`, so a drop that
# adds a rifle behind SENIOR STRIDER is two text files and no code.
name = CANDIDATE
xp = 0
stipend = 0
blurb = Not a Strider. Somebody who was in the right bunk on the wrong morning.
unlock = A sidearm and twelve rounds.
