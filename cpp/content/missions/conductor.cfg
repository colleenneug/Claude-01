# Campaign 16 of 16 - THE CONDUCTOR.
# The floor of the ark, and the dais at the middle of it.
# Ported from the browser build's campaign (src/js/fps/campaign.js) so
# both builds run the same route and the same comms thread.
name = THE CONDUCTOR
campaign = 16
zone = deckzero
objective = Silence the Conductor.
brief = It was Chief Engineer M. Okonkwo. He asked the shipmind to sing one note in year six and he never stopped. Its shield is the song itself - you cannot shoot that.
arena = 192
# The look of this sector - see MissionDef in src/Content.h.
floor_colour = 0.09, 0.08, 0.11
sky_zenith = 0.012, 0.010, 0.018
sky_horizon = 0.10, 0.06, 0.12
fog_colour = 0.10, 0.06, 0.12
fog_density = 0.022
sun_colour = 0.70, 0.58, 0.82
sun_intensity = 1.9
reward = 205

# No wave: the Conductor is the whole fight.
boss conductor 1.0

comms deploy 0.5 CONDUCTOR | YOU ARE FLAT.
comms deploy 4.0 VOSS | The nodes around the dais are resonance taps. It sings a phrase - shoot them back in that order.
comms deploy 9.0 VOSS | Get the phrase right and the shield drops. Get it wrong and it starts the bar again.
comms complete 1.0 DIVISION | Sector clear. Logged.
comms failed 0.8 DIVISION | Vitals flat. Pulling you back to the Cradle.
