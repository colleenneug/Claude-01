# This file is the entire content of a mission. Adding next month's drop is
# adding a file like this one to content/missions/ — no rebuild.
name = Patrol: Dust Shelf
arena = 80
reward = 40

# Marauders have a 22m attack range (content/enemies/marauder.cfg), so they
# spawn at 25 — outside it, well inside the 40m alert radius — and have to
# walk into the fight instead of opening fire from the spawn ring.
# The first mission anyone plays: a squad small enough to learn the fight
# on. The dig site is where it gets serious.
wave scarab 4 28
wave marauder 2 25

# Story, staged as comms traffic — same approach as the browser build:
#   comms <trigger> <delay> <speaker> | <line>
# triggers: deploy, half, cleared, boss, complete, failed
comms deploy 0.6 CRADLE CONTROL | DROP CONFIRMED. YOU'RE ON THE DUST SHELF.
comms deploy 4.5 CRADLE CONTROL | SCARAB SIGNATURES ALL AROUND YOU. CLEAR THEM OUT.
comms half 0.4 CRADLE CONTROL | HALF THE NEST IS DOWN. MARAUDERS ARE WAKING UP.
comms half 4.0 VANGUARD ECHO | THEY HIT HARDER THAN THE LITTLE ONES. KEEP MOVING.
comms complete 0.8 CRADLE CONTROL | SHELF IS QUIET. GOOD WORK, OPERATIVE.
comms complete 4.2 CRADLE CONTROL | CHITS ARE IN YOUR ACCOUNT. COME HOME.
comms failed 0.8 CRADLE CONTROL | WE LOST YOUR VITALS. PULLING YOU BACK.
