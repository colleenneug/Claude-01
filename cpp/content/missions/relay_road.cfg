# The first attack, mission 3 of 11 after the qualifications - THE RELAY ROAD.
# See the Campaign Plan in the lore doc for why you are here.
name = THE RELAY ROAD
campaign = 3
zone = highway
objective = Follow the relays and trace the signal.
brief = A line of Cyber relay masts runs down the old coast highway, passing the song from tap to tap. Wherever it goes, it starts somewhere.
arena = 142
floor_colour = 0.22, 0.22, 0.23
sky_zenith = 0.12, 0.14, 0.18
sky_horizon = 0.48, 0.50, 0.54
fog_colour = 0.42, 0.44, 0.48
fog_density = 0.012
sun_colour = 0.86, 0.88, 0.94
sun_intensity = 2.4
reward = 100
reward_xp = 340

wave marauder 6 30
wave drone 6 28
wave thrall 6 24

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Take the on-ramp
stage destroy relay_mast 3 | Cut the masts at the toll plaza
stage uplink 30 | Tap the relay and trace the signal
stage clear | Push through the jammed lanes
stage destroy relay_mast 3 | Cut the masts on the overpass
stage clear | Hold the bridge at the end of the road

comms deploy 0.5 DIVISION | Forty kilometres of masts, one every few hundred metres. Cut them and listen to where the song goes.
comms deploy 8.0 KAUR | Traffic is still on the road. Nobody is in it.
comms half 1.0 DIVISION | The signal is going out, not coming in. Up, past the sky.
comms cleared 1.0 DIVISION | Whatever is singing, it is talking to something a long way from here.
comms complete 1.0 KAUR | Road's quiet. Coming down.
comms failed 0.8 KAUR | You are down on the road. Hold on.
