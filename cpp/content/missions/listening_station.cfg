# The first attack, mission 9 of 11 after the qualifications - THE LISTENING STATION.
# See the Campaign Plan in the lore doc for why you are here.
name = THE LISTENING STATION
campaign = 9
zone = station
objective = Decode the last voice still singing.
brief = With the network quiet, one voice is still singing. The Division's old deep-listening station can work out what it is saying, and where it is saying it from.
arena = 164
floor_colour = 0.12, 0.12, 0.15
sky_zenith = 0.02, 0.03, 0.06
sky_horizon = 0.14, 0.16, 0.24
fog_colour = 0.10, 0.12, 0.18
fog_density = 0.018
sun_colour = 0.62, 0.70, 0.95
sun_intensity = 1.6
reward = 175
reward_xp = 560

wave thrall 10 24
wave warden 4 30
wave marauder 6 30

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Retake the listening station
stage uplink 40 | Feed the song to the Cradle
stage collect 4 | Recover the decoding cores
stage hold 45 | Hold the station while the song is decoded
stage clear | Clear the dish array

comms deploy 0.5 VOSS | One voice. If we can hear what it is saying, we can find where it is.
comms deploy 8.0 DIVISION | Everything they have left on the surface is coming to stop you.
comms half 1.0 VOSS | It is not a Cyber like the others. It is one of their leaders. The others follow its song.
comms cleared 1.0 DIVISION | We have a location. The great cave. We are calling him the Conductor.
comms complete 1.0 VOSS | The Conductor. Of course that is what it is. It has been conducting the whole thing.
comms complete 6.0 KAUR | I know the great cave. Nobody has come back up out of it in a week.
comms failed 0.8 KAUR | Station's lost. Coming for you.
reward_weapon = hal_ram
