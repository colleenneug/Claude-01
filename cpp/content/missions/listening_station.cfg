stage clear | Retake the listening station
stage uplink 35 | Feed the song to the Cradle
stage collect 4 | Recover the decoding cores
stage hold 40 | Hold while the Cradle decodes
stage clear | Clear the dish array

comms deploy 1.0 KAUR | Point Alder, dish array. It has been dark for a week but the hardware is intact.
comms deploy 8.0 DIVISION | We need the station online long enough for the Cradle to triangulate. That means holding it.
comms deploy 16.0 VOSS | I heard that song for thirty-four years. Whatever is still singing down there wrote the original.
comms deploy 28.0 VOSS | The decoding cores are scattered. Pull them and slot them — the Cradle cannot read a partial feed.
comms half 1.0 DIVISION | The Cradle is listening. Hold your ground, Strider.
comms half 9.0 VOSS | The pattern is resolving. One voice, underneath all of it. Not a tap. Not a relay. A conductor.
comms cleared 1.0 DIVISION | Decode is complete. Coordinates confirmed.
comms cleared 5.0 VOSS | The Conductor. In the great cave, under the southern range. It has been there since they landed, and every tap on Earth sings because it tells them to.
comms cleared 12.0 KAUR | I have the coordinates. Whenever you are ready, Strider.
comms failed 0.8 DIVISION | Signal lost. Recovering you to the hideout.
