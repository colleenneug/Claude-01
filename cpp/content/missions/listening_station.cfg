# EARTH 17 — THE LISTENING STATION. The last voice still singing after the
# dam went dark. Feed it to the Cradle and decode it. This is where you
# learn the Conductor's name and where it is.
name = THE LISTENING STATION
track = earth
campaign = 17
objective = Decode the last voice still singing.
brief = Every tap on the coast is dark except one signal that has its own power and its own voice. The dish array at Point Alder can decode it, if you can hold the station long enough for the Cradle to listen.
arena = 150
cover = 0.9
reward = 185
reward_xp = 720
wave warden 5 54
