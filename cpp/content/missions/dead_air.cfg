# The first attack, mission 1 of 11 after the qualifications - DEAD AIR.
# See the Campaign Plan in the lore doc for why you are here.
name = DEAD AIR
campaign = 1
zone = outpost
objective = Find out why every radio on Earth is singing.
brief = A Division listening post on the cliffs went silent two days ago. Since then every radio the Division owns has been picking up the same thing: singing.
arena = 130
floor_colour = 0.18, 0.20, 0.20
sky_zenith = 0.06, 0.08, 0.10
sky_horizon = 0.30, 0.36, 0.40
fog_colour = 0.28, 0.32, 0.36
fog_density = 0.022
sun_colour = 0.70, 0.78, 0.86
sun_intensity = 2.0
# Weather: how much of the sky is cloud, and how much water is standing
# on the ground (see MissionDef in src/Content.h). Both are 0 to 1.
clouds = 0.85
wetness = 0.50
reward = 70
reward_xp = 260

wave scarab 6 26
wave drone 5 28
wave marauder 3 30

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Get into the listening post
stage uplink 25 | Restore the post's power
stage collect 3 | Pull the post's recordings
stage destroy 1 | Find what is singing
stage clear | Get back to the drop zone

comms deploy 0.5 KAUR | Drop zone is the cliff road. I will be overhead when you need me.
comms deploy 6.0 DIVISION | Strider, this is Division. The post went dark two days ago. Find out why the radios sing.
comms half 1.0 DIVISION | The recordings are all the same song. Something on this site is broadcasting it.
comms cleared 1.0 DIVISION | A pylon. The Cybers built a pylon here, and it sings. We are calling it a resonance tap.
comms complete 1.0 KAUR | Got you. Climbing.
comms complete 5.0 DIVISION | If there is one tap, there are more. Find them.
comms failed 0.8 KAUR | Lost your signal. Coming down for you.
reward_weapon = hal_wren
