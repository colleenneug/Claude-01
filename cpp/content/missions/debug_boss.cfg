# A one-hostile-then-boss fixture, kept for the same reason as
# debug_single: verifying the boss spawn -> boss bar -> boss comms ->
# mission complete path in isolation, without a full wave's DPS and a
# 900-HP health pool making every test run four minutes long.
name = DEBUG: Boss Check
objective = Verify the boss pipeline.
brief = Not a real mission - a fixture for testing the boss health bar and reward payout.
arena = 60
reward = 10

wave scarab 1 12
boss colossus 0.18

comms deploy 0.3 CRADLE CONTROL | DEBUG FIXTURE. ONE ESCORT, ONE COLOSSUS.
comms cleared 0.2 CRADLE CONTROL | ESCORT DOWN. IT IS COMING UP.
comms boss 0.2 VANGUARD ECHO | THERE IT IS. HEAD SHOTS.
comms complete 0.3 CRADLE CONTROL | COLOSSUS DOWN. FIXTURE PASSED.
