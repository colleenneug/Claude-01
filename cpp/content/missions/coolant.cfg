# Campaign 16 of 22 - COOLANT LINE.
# Everything the ark still has runs through here.
# Ported from the browser build's campaign (src/js/fps/campaign.js) so
# both builds run the same route and the same comms thread.
name = COOLANT LINE
campaign = 16
zone = reactor
objective = Hold the coolant line while the reactor spins up.
brief = Diverting power to the choir array means the antechamber runs hot and loud, and everything aboard can hear exactly where you are standing.
arena = 168
# The look of this sector - see MissionDef in src/Content.h.
floor_colour = 0.20, 0.15, 0.12
sky_zenith = 0.070, 0.036, 0.024
sky_horizon = 0.58, 0.26, 0.12
fog_colour = 0.44, 0.22, 0.14
fog_density = 0.018
sun_colour = 1.00, 0.62, 0.34
sun_intensity = 3.0
reward = 165

wave warden 4 30
wave thrall 11 24
wave drone 5 26

# The route, stage by stage - see MissionStage in src/Content.h.
stage hold 45 | Hold the coolant line
stage clear | Clear the pump galleries
stage uplink 35 | Spin up the reactor
stage hold 30 | Hold until the reactor is stable

comms deploy 0.5 DIVISION | Reactor spinning up. Whatever is left aboard is coming to you now.
comms deploy 9.0 VOSS | It is calling them home. All of them. Stand somewhere with a wall behind you.
comms complete 1.0 DIVISION | Sector clear. Logged.
comms failed 0.8 DIVISION | Vitals flat. Pulling you back to the Cradle.
