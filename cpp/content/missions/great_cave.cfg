# The first attack, mission 11 of 11 after the qualifications - THE GREAT CAVE.
# See the Campaign Plan in the lore doc for why you are here.
name = THE GREAT CAVE
campaign = 11
zone = cave
objective = Go down into the great cave and defeat the Conductor.
brief = One big, hard fight. His last line of defence, his guardian, his shield, and then the Conductor himself, at the bottom of the great cave.
arena = 192
floor_colour = 0.10, 0.09, 0.10
sky_zenith = 0.012, 0.010, 0.018
sky_horizon = 0.10, 0.06, 0.12
fog_colour = 0.09, 0.06, 0.12
fog_density = 0.024
sun_colour = 0.66, 0.52, 0.82
sun_intensity = 1.7
# Weather: how much of the sky is cloud, and how much water is standing
# on the ground (see MissionDef in src/Content.h). Both are 0 to 1.
clouds = 0.80
reward = 320
reward_xp = 1200

wave thrall 14 24
wave warden 5 30
wave scarab 10 26
wave marauder 6 30
boss conductor 1.0

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Descend into the great cave
stage clear | Break through the Conductor's last line
stage destroy 3 | Break the taps on the cave bridge
stage champion executor_1 | Defeat EXECUTOR-1
stage sequence 6 | Break the taps in the order he sings
stage hold 45 | Hold the cave while his shield fails
stage boss | Defeat the Conductor

comms deploy 0.5 DIVISION | This is it, Strider. Everything we found leads down there.
comms deploy 8.0 VOSS | His shield is the song. Break the taps in the order he sings them. One wrong note and it all comes back.
comms half 1.0 KAUR | Something huge ahead. It has a name stamped on it. EXECUTOR-1.
comms cleared 1.0 VOSS | Listen to him. Watch which tap sings. Then break that one.
comms boss 0.5 CONDUCTOR | YOU ARE FLAT.
comms boss 5.0 VOSS | That is him. That is the voice. Finish it.
comms complete 1.0 KAUR | It stopped. The song stopped. Come home.
comms complete 8.0 MERCER | There is a KITE in my bay with your name on it, Strider. Second class. Come and get it.
comms complete 16.0 DIVISION | The Conductor was one of them. Only one. Rest while you can.
comms failed 0.8 KAUR | Strider down in the cave. Coming in, whatever it takes.
reward_weapon = ch_arc
