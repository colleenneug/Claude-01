# Where a new record starts: Earth, Kourou, Block D, four hours before you
# were due to ship out - and the thing Division recovered off the ark woke up
# on the other side of the building first.
#
# `layout` builds the block itself (src/Sites.cpp): bunks, corridor, armoury,
# muster hall, and then the pad outside. `start_unarmed` means exactly that -
# you wake up with nothing and there is a sidearm in the footlocker at the
# end of your bunk.
name = BLOCK D
track = earth
campaign = 1
tutorial = true
layout = kourou_block_d
start_unarmed = true
objective = Get out of the block.
brief = Four hours before you ship out, in the bunks, in the dark. The alarm you were told would never sound is sounding.
reward = 40
reward_xp = 160

# Indoors for the first four rooms, so the grade is the block's own emergency
# lighting; the pad outside is lit by the sun and the contrast is the point.
floor_colour = 0.21, 0.21, 0.23
sky_zenith = 0.16, 0.30, 0.62
sky_horizon = 0.72, 0.80, 0.92
fog_colour = 0.30, 0.31, 0.36
fog_density = 0.010
# The block has a roof on it, so nothing outside lights it: the strips
# overhead read as the sources and this carries the rooms.
ambient = 0.145, 0.145, 0.168
sun_colour = 1.00, 0.96, 0.88
sun_intensity = 4.2

# ---- cutscenes. Each `scene` line is one held shot:
#   scene <id> <seconds> | <camera x,y,z> | <looking at x,y,z> | <caption>
# Consecutive shots of the same scene ease into each other, so a slow push in
# is two lines rather than a keyframe format. The scene called "wake" plays on
# arrival and "complete" plays when the place is clear; the rest fire from
# the trigger box of the same name.
scene wake 3.4 | -1.2, 0.45, -26.2 | -1.2, 1.9, -25.0 | Four hours before you ship out.
scene wake 3.2 | -1.2, 0.75, -26.1 | -1.0, 1.6, -22.0 | The alarm you were told would never sound is sounding.
scene wake 3.0 | -1.2, 1.35, -26.0 | -0.6, 1.2, -21.0 | Nobody is shouting. That is the part that wakes you.

scene outside 3.6 | 0.0, 2.4, 33.0 | 0.0, 6.0, 60.0 | The blast door is already open.
scene outside 3.4 | 0.0, 3.1, 36.0 | 6.0, 1.2, 62.0 | Six days ago the ark started singing, eleven light-years out.
scene outside 3.2 | 0.0, 2.2, 38.0 | -6.0, 1.0, 66.0 | Whatever they brought back for study is on the pad now.
scene outside 3.0 | 0.0, 2.4, 40.0 | 30.0, 3.0, 70.0 | The transport on the far pan is not yours. Nothing here is yours yet.

# The closing scene here is short now: the lift off Earth belongs to the last
# qualification of the programme, six missions later. What happens at the end
# of this one is that somebody walks you inside.
scene complete 3.4 | 10.0, 2.7, 45.0 | 30.0, 3.2, 70.0 | The transport on the pan is not here for you.
scene complete 3.2 | 16.0, 2.4, 52.0 | 30.0, 2.6, 68.0 | It is here for whatever they brought back, and it is already loading.
scene complete 3.4 | 6.0, 2.2, 40.0 | -20.0, 3.0, 20.0 | Somebody takes your elbow and walks you the other way. Across the pan, to a shed with the lights on.

# ---- comms. The block's story, staged the way every other mission stages
# its story, rather than as a screen you skip.
comms deploy 1.0 DIVISION | Block D, this is Division. Containment failed at the lab, twenty minutes ago.
comms deploy 8.0 DIVISION | You were the only one still in the bunks. Everyone else mustered.
comms deploy 15.0 DIVISION | There is a sidearm in your footlocker. Your issue is in the armoury. Get there.
comms deploy 30.0 VOSS | Whoever that is on Block D's channel - do not stop to look at them.
comms deploy 38.0 VOSS | They were people this morning. They are still wearing the badges.
comms deploy 52.0 DIVISION | Muster hall is clear on sensors. The pad is not.
comms complete 1.0 DIVISION | Pad is clear. Stand down, candidate.
comms complete 6.0 DIVISION | Ground station is expecting you. Marcheva runs the programme; talk to her first.
comms complete 12.0 VOSS | Nobody goes up unrated. Six qualifications. Then we talk.
comms failed 0.8 DIVISION | Vitals flat. Reset the block and take it again.
