# Where a new record starts: your own house, the night the Cybers reach your
# street. The Division is dropping supply pods for survivors and sending
# ships down for anyone who can make it to the road.
#
# `layout` builds the house itself (src/Sites.cpp): bedroom, hallway, living
# room, garage, and then the street outside. `start_unarmed` means exactly
# that - you wake up with nothing and there is a pistol in the lockbox across
# your bedroom.
name = HOME
track = earth
campaign = 1
tutorial = true
layout = home
start_unarmed = true
objective = Get out of the house and reach the Division ship.
brief = Three days ago the Earth was fine. Tonight the Cybers reached your street.
reward = 40
reward_xp = 160

# Indoors for the first four rooms, lit by the fires through the windows;
# the street outside is under a sky full of smoke.
floor_colour = 0.21, 0.21, 0.23
sky_zenith = 0.10, 0.08, 0.09
sky_horizon = 0.56, 0.32, 0.20
fog_colour = 0.32, 0.24, 0.21
fog_density = 0.010
# The house has a roof on it, so nothing outside lights it: the glow from
# the fires reads as the source and this carries the rooms.
ambient = 0.145, 0.145, 0.168
sun_colour = 1.00, 0.70, 0.48
sun_intensity = 3.0

# ---- cutscenes. Each `scene` line is one held shot:
#   scene <id> <seconds> | <camera x,y,z> | <looking at x,y,z> | <caption>
# Consecutive shots of the same scene ease into each other, so a slow push in
# is two lines rather than a keyframe format. The scene called "wake" plays on
# arrival and "complete" plays when the place is clear; the rest fire from
# the trigger box of the same name.
scene wake 3.4 | -1.2, 0.45, -26.2 | -1.2, 1.9, -25.0 | Three days ago the Earth was fine.
scene wake 3.2 | -1.2, 0.75, -26.1 | -1.0, 1.6, -22.0 | The power is out. Something is in the house.
scene wake 3.0 | -1.2, 1.35, -26.0 | -0.6, 1.2, -21.0 | The street has gone quiet. That is the part that wakes you.

scene outside 3.6 | 0.0, 2.4, 33.0 | 0.0, 6.0, 60.0 | The garage door is already open.
scene outside 3.4 | 0.0, 3.1, 36.0 | 6.0, 1.2, 62.0 | The Cybers came in ships, and the whole town is burning.
scene outside 3.2 | 0.0, 2.2, 38.0 | -6.0, 1.0, 66.0 | Something is singing. You can hear it from every direction.
scene outside 3.0 | 0.0, 2.4, 40.0 | 30.0, 3.0, 70.0 | At the end of the street, a Division ship is coming down.

# The closing scene is short: the lift to the Cradle belongs to the last
# qualification. What happens at the end of this one is that the Division
# finds you.
scene complete 3.4 | 10.0, 2.7, 45.0 | 30.0, 3.2, 70.0 | The Division ship is down, and its ramp is open.
scene complete 3.2 | 16.0, 2.4, 52.0 | 30.0, 2.6, 68.0 | It came for anyone still alive on this street.
scene complete 3.4 | 6.0, 2.2, 40.0 | 30.0, 2.6, 62.0 | Somebody in Division armour takes your arm and pulls you aboard. They are taking you to a hideout.

# ---- comms. A Division broadcast on the radio by your bed, the voice that
# guides you out, the same way every other mission stages its story.
comms deploy 1.0 DIVISION | This is the Division. If you can hear this, you are not alone.
comms deploy 8.0 DIVISION | We are dropping supply pods on every street we can reach. Find one.
comms deploy 15.0 DIVISION | Do not stay inside. Get to the road. We are sending ships for survivors.
comms deploy 30.0 DIVISION | Survivor, we have your signal. There is a pod down in your house. Arm yourself.
comms deploy 40.0 DIVISION | Those are Scarabs. Small and fast. Keep moving and keep shooting.
comms deploy 54.0 DIVISION | Ship is coming down at the end of your street. Get there.
comms complete 1.0 DIVISION | Street is clear. You are coming with us.
comms complete 6.0 DIVISION | We are taking you to a hideout. Marcheva runs it. Talk to her first.
comms complete 12.0 MARCHEVA | Anyone who can shoot like that is going in the Strider programme. Seven qualifications. Fast.
comms failed 0.8 DIVISION | We lost your signal. Try again, survivor.
