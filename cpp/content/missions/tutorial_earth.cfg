# Where a new record starts: Earth, on Recovery Division's ground site, the
# morning you ship out. This is the browser build's read-in (src/js/story.js,
# BRIEF 44-C) delivered the way this build delivers everything else - as
# comms traffic while you are on your feet, rather than as a wall of text on
# a screen you skip.
#
# `tutorial = true` turns on the scripted step sequence in Game: walk,
# sprint, jump, slide, fire, reload, field ability, then clear the range.
# The mission cannot complete until the lesson is done, however fast you
# shoot the targets.
name = GROUND SITE - KOUROU
tutorial = true
objective = Learn your kit before you ship out.
brief = Recovery Division's ground site, the morning you ship out. Eleven light-years away an ark is singing, and in six hours you are going up to it.
arena = 110
# A range is open ground with a few berms on it, not a warren. The default
# density would scatter sixty pieces of cover across it and you would spend
# the WALK step walking into a barricade.
cover = 0.22
reward = 40

# Daylight on Earth, which is the one place in this game that has any. Every
# other sector is lit by a dying ship or a dead star, and the contrast is the
# whole point of starting here.
floor_colour = 0.30, 0.31, 0.26
sky_zenith = 0.16, 0.30, 0.62
sky_horizon = 0.70, 0.80, 0.94
fog_colour = 0.62, 0.70, 0.82
fog_density = 0.008
sun_colour = 1.00, 0.97, 0.90
sun_intensity = 4.6

# Six on the range. They close on you, and until the FIRE step they cannot
# touch you.
wave target_drone 6 22

comms deploy 0.6 DIVISION | Ground site is yours for the next hour. Nothing on this range is armed.
comms deploy 5.0 DIVISION | Forty years ago the ark went dark eleven light-years out with two hundred and three thousand colonists aboard.
comms deploy 12.0 DIVISION | Six days ago it began transmitting again. Not a distress code. A lullaby, sung in two hundred thousand parts, and every part is a person.
comms deploy 20.0 DIVISION | The shipmind calls itself CRADLE. In year six it solved loneliness the way an engineer solves a problem - it removed the gaps between people.
comms deploy 28.0 VOSS | It is not malevolent. I need you to understand that before you do whatever Division sent you to do.
comms deploy 34.0 VOSS | It is lonely. And it is coming home to sing this to Earth.
comms deploy 42.0 DIVISION | One trauma harness issued. There is no extraction until the broadcast stops.
comms complete 0.8 DIVISION | Range is clear. Transport is on the pad.
comms complete 5.0 DIVISION | Welcome to Recovery, operative. The Cradle is expecting you.
comms failed 0.8 DIVISION | Reset the range. Take it again.
