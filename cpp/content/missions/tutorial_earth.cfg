# Where a new record starts: Earth, your house, in the middle of the night.
# The Cybers reach your street while you sleep. You wake up to a sound you
# have never heard before, and by the time you reach the window they are
# already on the pavement.
#
# `layout` builds the house (src/Sites.cpp): bedroom, hallway, living room,
# garage, and then the street outside. `start_unarmed` means exactly that -
# you wake up with nothing and there is a pistol in the lockbox by the bed.
name = HOME
track = earth
campaign = 1
tutorial = true
layout = home
start_unarmed = true
objective = Get out of the house and clear the street.
brief = Three in the morning and something is on your street. The radio by the bed is hissing a frequency you have never been told about, and a voice on it is telling you to move.
reward = 40
reward_xp = 160

# Indoors for the first four rooms, so the grade is the house's own light;
# the street outside is lit by fires and the Cybers' own glow, and the
# contrast is the point.
floor_colour = 0.21, 0.21, 0.23
sky_zenith = 0.04, 0.05, 0.10
sky_horizon = 0.18, 0.14, 0.12
fog_colour = 0.22, 0.18, 0.16
fog_density = 0.012
# The house has a roof on it, so nothing outside lights it: the bedside
# lamp and the hallway light read as the sources and this carries the rooms.
ambient = 0.145, 0.145, 0.168
sun_colour = 1.00, 0.72, 0.48
sun_intensity = 2.4

# ---- cutscenes. Each `scene` line is one held shot:
#   scene <id> <seconds> | <camera x,y,z> | <looking at x,y,z> | <caption>
# Consecutive shots of the same scene ease into each other, so a slow push in
# is two lines rather than a keyframe format. The scene called "wake" plays on
# arrival and "complete" plays when the place is clear; the rest fire from
# the trigger box of the same name.
scene wake 3.4 | -1.2, 0.45, -26.2 | -1.2, 1.9, -25.0 | Three in the morning. Something woke you.
scene wake 3.2 | -1.2, 0.75, -26.1 | -1.0, 1.6, -22.0 | The radio by the bed is on a frequency you were never told about.
scene wake 3.0 | -1.2, 1.35, -26.0 | -0.6, 1.2, -21.0 | A voice on it is telling you to move. You have never heard it before, and it knows your name.

scene outside 3.6 | 0.0, 2.4, 33.0 | 0.0, 6.0, 60.0 | The garage door is open and the street is on fire.
scene outside 3.4 | 0.0, 3.1, 36.0 | 6.0, 1.2, 62.0 | They are on the pavement. Metal and light and a sound like singing.
scene outside 3.2 | 0.0, 2.2, 38.0 | -6.0, 1.0, 66.0 | Whatever came down six days ago has reached your road.
scene outside 3.0 | 0.0, 2.4, 40.0 | 30.0, 3.0, 70.0 | Something in the sky has a searchlight on the far end of the street.

# The closing scene: the Division ship collects you. The qualification
# programme starts at the hideout, seven missions later.
scene complete 3.4 | 10.0, 2.7, 45.0 | 30.0, 3.2, 70.0 | The ship at the end of the street is not one you recognise.
scene complete 3.2 | 16.0, 2.4, 52.0 | 30.0, 2.6, 68.0 | A ramp comes down and somebody puts a hand out.
scene complete 3.4 | 6.0, 2.2, 40.0 | -20.0, 3.0, 20.0 | Your street drops away. The fires get smaller. The singing does not.

# ---- comms. The house's story, staged the way every other mission stages
# its story, rather than as a screen you skip.
comms deploy 1.0 DIVISION | This is Division on the emergency band. If you can hear this, you are still alive. Stay that way.
comms deploy 8.0 DIVISION | There is a pistol in the lockbox by your bed. Combination is on the radio display. Get it.
comms deploy 15.0 DIVISION | Reach the living room. There is a supply pod by the front door. Take what is inside it.
comms deploy 28.0 VOSS | Whoever is on this channel - they are not people. Do not try to talk to them.
comms deploy 36.0 VOSS | They came down six days ago. We have been watching your file since before you woke up.
comms deploy 48.0 DIVISION | The garage is your way out. The street is not clear, but the ship is on its way.
comms deploy 58.0 DIVISION | The street. Clear it. The ship needs a landing zone.
comms complete 1.0 DIVISION | Street is clear. The ship is down. Get on it.
comms complete 6.0 DIVISION | We have a place. Not far. Marcheva runs the programme there; talk to her first.
comms complete 12.0 VOSS | Nobody fights unrated. Seven qualifications. Then we talk about what they are.
comms failed 0.8 DIVISION | Vitals flat. Resetting the house. Take it again.
