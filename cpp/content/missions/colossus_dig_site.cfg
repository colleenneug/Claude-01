# A boss mission: a wave of regular hostiles, then a named boss with a
# health multiplier on top of its base content/enemies/colossus.cfg stats.
name = The Dig Site: Colossus
objective = Break the excavation frame holding the dig.
brief = Something under the dust shelf is being dug up, and whatever is doing the digging has decided the site is its.
arena = 90
reward = 120

wave scarab 4 30
wave marauder 3 25
boss colossus 2.2

comms deploy 0.6 CRADLE CONTROL | THIS IS THE DIG SITE. THEY WERE DOWN HERE FIRST.
comms deploy 5.0 VANGUARD ECHO | SOMETHING BIG IS REGISTERING UNDER THE FLOOR. WATCH YOURSELF.
comms half 0.4 CRADLE CONTROL | THE SMALL ONES ARE GUARDING SOMETHING. PUSH THROUGH.
comms cleared 0.5 VANGUARD ECHO | THAT'S THE LAST OF THE ESCORT. IT'S COMING UP.
comms boss 0.3 CRADLE CONTROL | COLOSSUS. ARMOUR PLATING, SLOW TURN. USE THE COVER.
comms boss 5.5 VANGUARD ECHO | HEAD SHOTS. DON'T STAND STILL. YOU'VE GOT THIS.
comms complete 0.8 CRADLE CONTROL | COLOSSUS IS DOWN. THE DIG SITE IS OURS.
comms complete 4.5 VANGUARD ECHO | NOT BAD, OPERATIVE. NOT BAD AT ALL.
comms failed 0.8 CRADLE CONTROL | VITALS FLATLINED. RECOVERING YOU NOW.
