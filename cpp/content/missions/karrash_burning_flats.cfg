# The desert world's mission: the hardest of the non-boss drops. A big,
# hot, open arena and the largest regular squad in the game.
name = Karrash: Burning Flats
objective = Clear the flats.
brief = Karrash is sand and dark rock and nothing that should still be walking on it.
arena = 100
reward = 90

wave scarab 6 32
wave marauder 3 27

comms deploy 0.6 CRADLE CONTROL | KARRASH. SURFACE TEMPERATURE IS ALREADY PAST SAFE.
comms deploy 5.0 VANGUARD ECHO | MAKE IT QUICK. YOUR SUIT WILL NOT LOVE THIS ONE.
comms half 0.4 VANGUARD ECHO | HALFWAY. KEEP MOVING, THE SAND WILL COOK YOU IF YOU STAND STILL.
comms complete 0.8 CRADLE CONTROL | FLATS ARE CLEAR. GOOD. COME HOME.
comms failed 0.8 CRADLE CONTROL | VITALS GONE. PULLING YOU OUT.
