# A second player-versus-player arena, the same rules as the Pit (see
# the_pit.cfg): free-for-all, the leader sings and is marked for everyone.
# The Sump is the flooded lower deck under the Pit: bigger, darker, thick
# with cover, and a longer match.
name = The Sump
objective = First to fifteen downs. The leader sings; the dark does not hide them.
brief = Below the Pit the old reservoir never quite drained. The Sump is wide, wet and full of the junk the Division dumped there, which makes it the best place under the hideout to learn to fight somebody who is hiding. The tap down here sings louder than the one upstairs.
mode = pvp
score_limit = 15
arena = 110
cover = 1.4
reward = 0
reward_xp = 0
floor_colour = 0.16, 0.20, 0.22
sky_zenith = 0.02, 0.03, 0.05
sky_horizon = 0.10, 0.16, 0.18
fog_colour = 0.10, 0.16, 0.18
fog_density = 0.03
sun_colour = 0.70, 0.90, 1.00
sun_intensity = 2.4
comms deploy 1.0 BRIGHT | The Sump. Wide, dark, wet. Somebody is already behind the junk on your left.
