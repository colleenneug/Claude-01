# The first attack, mission 10 of 11 after the qualifications - THE GATE.
# See the Campaign Plan in the lore doc for why you are here.
name = THE GATE
campaign = 10
zone = gate
objective = Break the taps around the great cave and open the way down.
brief = The great cave's mouth is ringed with taps, and everything the Conductor has left on the surface is standing between you and the way down.
arena = 170
floor_colour = 0.20, 0.19, 0.18
sky_zenith = 0.10, 0.09, 0.10
sky_horizon = 0.52, 0.36, 0.26
fog_colour = 0.40, 0.31, 0.26
fog_density = 0.014
sun_colour = 1.00, 0.70, 0.50
sun_intensity = 2.6
# Weather: how much of the sky is cloud, and how much water is standing
# on the ground (see MissionDef in src/Content.h). Both are 0 to 1.
clouds = 0.80
wetness = 0.15
reward = 190
reward_xp = 600

wave warden 4 30
wave thrall 12 24
wave marauder 6 30
boss colossus 1.6

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Fight up the valley
stage destroy 4 | Break the outer taps
stage clear | Take the cave mouth
stage destroy 4 | Break the taps sealing the way down
stage hold 40 | Hold the mouth while the charges are set
stage boss | Bring down the Colossus at the gate

comms deploy 0.5 DIVISION | Every Strider we have is on the valley wall. You are the one going in.
comms deploy 8.0 MARCHEVA | I trained you for this. I did not think it would be this fast.
comms half 1.0 DIVISION | Outer ring is down. He knows you are coming.
comms cleared 1.0 DIVISION | Charges set. When the door blows, the way down is open.
comms boss 0.6 KAUR | Something big at the mouth. Bigger than anything I have flown over.
comms complete 1.0 DIVISION | The gate is open. Rest. Then go down.
comms failed 0.8 KAUR | Lost you at the gate. Coming in.
reward_weapon = hal_pipit
