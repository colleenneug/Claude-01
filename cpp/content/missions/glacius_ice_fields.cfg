# The ice world's mission. A wide, open field — fewer places to hide, so
# the squad is smaller and the marauders start further out.
name = Glacius: Ice Fields
objective = Sweep the frozen shelf.
brief = A relay station on Glacius stopped answering. Its crew did not stop moving.
arena = 95
reward = 70
terrain = ice
floor_colour = 0.62 0.68 0.74
sky_zenith = 0.08 0.12 0.22
sky_horizon = 0.45 0.52 0.58
fog_colour = 0.50 0.56 0.62
sun_colour = 0.90 0.92 0.98
fog_density = 0.025

wave scarab 4 30
wave marauder 3 27

comms deploy 0.6 CRADLE CONTROL | DOWN ON GLACIUS. WATCH YOUR FOOTING OUT THERE.
comms deploy 5.0 VANGUARD ECHO | NOTHING GROWS HERE. WHATEVER IS MOVING IS NOT SUPPOSED TO BE.
comms half 0.4 CRADLE CONTROL | HALF OF THEM DOWN. THE REST ARE CIRCLING WIDE.
comms complete 0.8 CRADLE CONTROL | ICE FIELDS ARE CLEAR. GET BACK TO THE SHIP BEFORE YOU FREEZE.
comms failed 0.8 CRADLE CONTROL | WE LOST YOU ON THE ICE. RECOVERING NOW.
