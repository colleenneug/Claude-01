# Campaign 5 of 22 - COUNTER-ATTACK.
# The only way aft, and the only room on the deck with four doors.
# Ported from the browser build's campaign (src/js/fps/campaign.js) so
# both builds run the same route and the same comms thread.
name = COUNTER-ATTACK
campaign = 5
zone = junction
objective = Hold Junction 9 until the blast doors cycle.
brief = You took it. Now keep it. The doors need ninety seconds and the ark has noticed.
arena = 120
# The look of this sector - see MissionDef in src/Content.h.
floor_colour = 0.19, 0.18, 0.18
sky_zenith = 0.034, 0.036, 0.046
sky_horizon = 0.22, 0.19, 0.18
fog_colour = 0.24, 0.21, 0.21
fog_density = 0.014
sun_colour = 0.95, 0.90, 0.82
sun_intensity = 2.8
reward = 85

wave thrall 6 24
wave drone 4 26
wave warden 1 30
boss warden 2.0

# The route, stage by stage - see MissionStage in src/Content.h.
stage hold 40 | Hold Junction 9 until the blast doors cycle
stage clear | Push them back down the corridor
stage boss | Bring down the Warden leading the push

comms deploy 0.5 DIVISION | Blast doors cycling. Hold the room, operative.
comms deploy 6.0 CRADLE | I am not sending them to hurt you. I am sending them to finish the piece.
comms complete 1.0 DIVISION | Sector clear. Logged.
comms failed 0.8 DIVISION | Vitals flat. Pulling you back to the Cradle.
