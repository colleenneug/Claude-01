# The Tuning: the Gambit-style mode, two teams of up to four.
#
# Each team fights in its own copy of this arena (you only ever see your
# own side). Every Cyber you put down gives you notes — one for a small one,
# two for a Marauder or a Thrall, three for anything heavier — up to fifteen
# carried. Walk into the tap in the middle to bank them. Bank five at once
# and a screamer (a singing Warden) drops into the other team's arena; ten
# sends two, fifteen sends four. Go down and the notes you carry are gone.
# First team to bank score_limit notes wins.
#
# The waves below are the arena's stock: the host keeps that many Cybers on
# the floor, topping them up as they fall. Offline it is a score attack.
name = The Tuning
objective = Bank sixty notes at the tap before the other team does.
brief = The Division found a way to use the Cybers' own song against them. Every Cyber carries a few notes of it; put one down and they are yours. Carry them to the capped tap in the middle of the arena and it banks them, and a big enough deposit plays back through the other team's tap and wakes something there. Two squads, two copies of the same floor, one tune.
