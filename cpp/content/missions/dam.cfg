# The first attack, mission 8 of 11 after the qualifications - THE DAM.
# See the Campaign Plan in the lore doc for why you are here.
name = THE DAM
campaign = 8
zone = dam
objective = Cut the power the taps are drawing from Hollow Creek Dam.
brief = The taps are drawing their power from the Hollow Creek hydro dam. Shut it down and every tap on the continent goes quiet at once.
arena = 160
floor_colour = 0.18, 0.20, 0.20
sky_zenith = 0.06, 0.08, 0.10
sky_horizon = 0.30, 0.36, 0.40
fog_colour = 0.28, 0.32, 0.36
fog_density = 0.022
sun_colour = 0.70, 0.78, 0.86
sun_intensity = 2.0
# Weather: how much of the sky is cloud, and how much water is standing
# on the ground (see MissionDef in src/Content.h). Both are 0 to 1.
clouds = 0.75
wetness = 0.55
reward = 160
reward_xp = 520

wave thrall 10 24
wave warden 3 30
wave drone 6 28

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Take the access road
stage uplink 30 | Open the spillway controls
stage destroy 4 | Break the taps on the turbine deck
stage hold 45 | Hold the control room while the turbines spin down
stage clear | Get across the crest

comms deploy 0.5 DIVISION | Cut the power and the whole network goes quiet. Then we listen for what is left.
comms deploy 8.0 KAUR | Weather is turning. I will be close.
comms half 1.0 DIVISION | Turbines spinning down. Taps are dying all over the continent.
comms cleared 1.0 DIVISION | Everything is quiet. Everything but one point. It is underground.
comms complete 1.0 KAUR | Got you. Hold on to something.
comms failed 0.8 KAUR | You are down on the dam. Coming.
reward_weapon = hal_osprey
