# Player versus player. The Division's sparring floor under the hideout,
# where Striders shoot each other with training-capped rounds because the
# Cybers will not hold still long enough to learn on.
#
# mode = pvp: no waves and no clear. Online, everyone in the same instance
# of the Pit is fair game; a down is a point to whoever did it and three
# seconds on the floor. First to score_limit wins, and whoever is leading is
# "singing" — marked for everyone, through walls, at any range. Offline it is
# an empty room to practise movement in.
name = The Pit
objective = First to ten downs. Whoever leads is singing, and everyone can hear it.
brief = Under the hideout there is a drained reservoir the Division calls the Pit. Striders fight each other down there with capped rounds, because a Cyber does not stand still long enough to learn on and another Strider does not stand still at all. Lead the match and the room's old resonance tap starts to sing with you: everyone knows where you are. Win anyway.
mode = pvp
score_limit = 10
arena = 70
cover = 0.9
reward = 0
reward_xp = 0
