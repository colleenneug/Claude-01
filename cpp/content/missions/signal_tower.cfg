# EARTH 14 — THE SIGNAL TOWER. The Cradle has been deaf for nine hours and
# needs a clean uplink from the hilltop relay compound. This is where the
# pattern in the song first shows a hand behind it.
name = THE SIGNAL TOWER
track = earth
campaign = 14
objective = Give the Cradle a clean uplink.
brief = The Cradle has been flying blind for nine hours. The hilltop relay compound is the last clean line of sight to orbit, and the taps have grown up around it like ivy.
arena = 140
cover = 1.0
reward = 170
reward_xp = 660
wave warden 4 50
wave thrall 10 44
wave drone 6 36

