# The first attack, mission 6 of 11 after the qualifications - THE SIGNAL TOWER.
# See the Campaign Plan in the lore doc for why you are here.
name = THE SIGNAL TOWER
campaign = 6
zone = signal
objective = Give the Cradle an uplink and let it hear the whole song.
brief = The Cradle can hear the song, but only in pieces. The old broadcast tower on Mount Carrow could let it hear everything at once.
arena = 150
floor_colour = 0.18, 0.20, 0.20
sky_zenith = 0.06, 0.08, 0.10
sky_horizon = 0.30, 0.36, 0.40
fog_colour = 0.28, 0.32, 0.36
fog_density = 0.022
sun_colour = 0.70, 0.78, 0.86
sun_intensity = 2.0
# Weather: how much of the sky is cloud, and how much water is standing
# on the ground (see MissionDef in src/Content.h). Both are 0 to 1.
clouds = 0.60
reward = 140
reward_xp = 450

wave marauder 6 30
wave drone 8 28
wave warden 2 30

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Climb to the tower compound
stage destroy 3 | Break the taps choking the tower
stage uplink 45 | Run the uplink to the Cradle
stage clear | Clear the relay station
stage uplink 35 | Hold the line while the Cradle listens

comms deploy 0.5 VOSS | Get me a clean line and I will listen to the whole thing.
comms deploy 8.0 DIVISION | The tower is choked with taps. They know what it can do.
comms half 1.0 VOSS | I have heard this before. Forty years of it, through a greenhouse door.
comms cleared 1.0 VOSS | It is not random. Every tap comes in on the same beat. Something is conducting it.
comms complete 1.0 KAUR | Tower's ours. Picking you up.
comms failed 0.8 KAUR | You are down on the mountain. Hold.
reward_weapon = hal_arc
