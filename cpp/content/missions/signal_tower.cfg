stage clear | Climb to the compound
stage destroy 3 | Break the resonance taps
stage uplink 35 | Run the uplink to the Cradle
stage clear | Clear the relay station
stage hold 40 | Hold the line while the Cradle listens

comms deploy 1.0 DIVISION | The Cradle has had no ground feed since yesterday. We need this uplink.
comms deploy 9.0 KAUR | I can see the compound from altitude. Three taps on the south face, wrapped around the dish mounts.
comms deploy 18.0 VOSS | The taps are not random. They grew toward the dishes. Whatever placed them knows what a signal path is.
comms half 1.0 DIVISION | Uplink is feeding. Hold the compound — the Cradle needs every second of this.
comms half 8.0 VOSS | Listen to what the dishes are picking up. The song has a rhythm to it now. Something is keeping time.
comms cleared 1.0 DIVISION | Uplink logged. The Cradle has nine hours of clean data.
comms cleared 6.0 VOSS | Something is conducting the song. Not a tap, not a relay. Something that decides what the next bar is.
comms failed 0.8 DIVISION | Uplink lost. Recovering you to the hideout.
