# The first attack, mission 7 of 11 after the qualifications - THE FORGE.
# See the Campaign Plan in the lore doc for why you are here.
name = THE FORGE
campaign = 7
zone = forge
objective = Shut down the line that is building Cybers on Earth.
brief = Something is building Marauders here, on Earth. The Division followed the supply trucks to the old Halden steelworks.
arena = 160
floor_colour = 0.21, 0.15, 0.11
sky_zenith = 0.08, 0.04, 0.03
sky_horizon = 0.66, 0.30, 0.12
fog_colour = 0.50, 0.24, 0.12
fog_density = 0.020
sun_colour = 1.00, 0.58, 0.30
sun_intensity = 3.0
reward = 150
reward_xp = 500

wave warden 3 30
wave thrall 8 24
wave marauder 6 30
boss colossus 1.2

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Get into the truck yard
stage destroy 4 | Break the taps powering the line
stage collect 3 | Pull the build orders from the line
stage clear | Clear the casting floor
stage boss | Destroy the Colossus coming off the line

comms deploy 0.5 DIVISION | They are not just landing soldiers. They are making them here.
comms deploy 8.0 VOSS | Steelworks. Of course. They take what we built and finish it their way.
comms half 1.0 DIVISION | The build orders are signed. The same mark, on every one.
comms cleared 1.0 DIVISION | Every order on this line comes from one place.
comms boss 0.6 DIVISION | Colossus on the line. It is not finished. Do not let it finish.
comms complete 1.0 KAUR | The forge is dark. Coming down.
comms failed 0.8 KAUR | Lost you in the heat. Hold on.
reward_weapon = hal_halyard
