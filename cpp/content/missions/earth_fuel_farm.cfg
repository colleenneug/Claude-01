# EARTH 07 - the fuel farm, the night before the window. Everything that is
# going to burn on launch day is in these tanks, and something is in the farm.
name = THE FUEL FARM
track = earth
campaign = 7
objective = Bleed the tanks and destroy the siphons.
brief = Forty tanks of hydrolox and the pipework between them. The launch is in nineteen hours. Whatever got through the fence is living among the tanks, and nobody is allowed to miss.
