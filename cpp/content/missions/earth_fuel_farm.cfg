stage clear | Clear the tank farm road
stage uplink 30 | Bleed the pressure valves
stage destroy 3 | Destroy the siphon masts
stage clear | Clear the pump house

comms deploy 1.0 DISPATCH | Do not shoot the tanks. I will say it twice. Do not shoot the tanks.
