# The first attack, mission 4 of 11 after the qualifications - THE HARBOUR.
# See the Campaign Plan in the lore doc for why you are here.
name = THE HARBOUR
campaign = 4
zone = harbour
objective = Board the landing ship and copy its flight logs.
brief = A Cyber landing ship is sitting in the harbour with its ramp down. Wherever it came from, it will have written it down.
arena = 150
floor_colour = 0.20, 0.21, 0.23
sky_zenith = 0.08, 0.13, 0.20
sky_horizon = 0.40, 0.50, 0.58
fog_colour = 0.36, 0.44, 0.50
fog_density = 0.016
sun_colour = 0.84, 0.90, 1.00
sun_intensity = 2.2
# Weather: how much of the sky is cloud, and how much water is standing
# on the ground (see MissionDef in src/Content.h). Both are 0 to 1.
clouds = 0.65
wetness = 0.60
reward = 120
reward_xp = 400

wave marauder 6 30
wave thrall 8 24
wave scarab 8 26
boss warden 3.0

# The route, stage by stage - see MissionStage in src/Content.h.
stage clear | Clear the fish market
stage collect 3 | Recover the dock manifests
stage clear | Fight through the cranes
stage uplink 35 | Copy the ship's navigation core
stage boss | Defeat the ship's Warden captain

comms deploy 0.5 DIVISION | Nobody has been inside one of their ships and come out. You will be the first.
comms deploy 8.0 VOSS | I rode one of those to Earth. Stay off the ramp until it is clear.
comms half 1.0 DIVISION | The manifests are in no language we have. The numbers are coordinates.
comms cleared 1.0 DIVISION | They did not come from here. Their course starts out in deep space.
comms boss 0.6 VOSS | That is the one that runs the ship. Do not let it close the ramp.
comms complete 1.0 KAUR | Logs are on the Cradle. Climbing.
comms failed 0.8 KAUR | Lost you in the harbour. Coming in low.
reward_weapon = hal_sprite
