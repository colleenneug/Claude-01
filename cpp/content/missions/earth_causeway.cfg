# EARTH 05 - the causeway. Escort duty down the coast road at dusk: the
# qualification is fighting while the thing you are protecting keeps moving.
name = THE CAUSEWAY
track = earth
campaign = 5
objective = Hold the coast road and bring the convoy cargo home.
brief = The causeway is eleven kilometres of single-lane road across the salt marsh, and the fuel convoy for the launch is on it tonight. Something has been coming up out of the marsh to meet it.
