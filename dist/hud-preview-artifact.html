<title>Vanguard HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&family=Share+Tech+Mono&display=swap">

<style>
/* ============================================================
   The component itself, verbatim from src/css/d2hud.css.
   ============================================================ */
/* ============================================================
   VANGUARD HUD — a modular readout built to a fixed spec.

   Every number in here is prescribed rather than tuned: 300x4 for the
   vitals bar, 2px between its segments, 40x40 ability panels with a 1px
   border and a 45-degree chamfer, 3rem over 1.2rem for the ammo, a
   60-degree divider between them, and a 1px frame inset 20px from the
   viewport. Where the spec is followed to the pixel it is called out,
   so a later edit knows what it is allowed to move.

   The component is self-contained: one root element, one stylesheet,
   no dependency on the game's own palette variables.
   ============================================================ */

.vhud, .vhud *, .vhud *::before, .vhud *::after {
  /* The component may be dropped into a page with no reset of its own, and
     the prescribed sizes are outer sizes: a 40x40 panel with a 1px border
     measures 42 under content-box. */
  box-sizing: border-box;
}

.vhud {
  /* ---- the palette, verbatim ---- */
  --shield: #4FE1D5;          /* electric teal */
  --health: #FFFFFF;          /* pure white */
  --super:  #F3A01C;          /* vibrant amber */
  --panel:  rgba(10, 15, 20, 0.45);

  --frame-inset: 20px;        /* the container frame's distance from the edge */
  --track: 0.15em;            /* ultra-wide, for the microscopic labels */

  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: 'Chakra Petch', 'Share Tech Mono', ui-monospace, system-ui, sans-serif;
  color: #dfe9ef;
}

/* ---------- the container frame ----------
   1px, inset 20px on every side. It is the outermost thing, so every
   other element is positioned against the same inset. */
.vhud-frame {
  position: absolute;
  inset: var(--frame-inset);
  border: 1px solid rgba(79, 225, 213, 0.28);
  pointer-events: none;
}

/* corner ticks, so the frame reads as an instrument and not as a box */
.vhud-frame::before,
.vhud-frame::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  border: 1px solid var(--shield);
}
.vhud-frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.vhud-frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

/* ---------- panels ----------
   The prescribed background, with the blur behind it. */
.vhud-panel {
  background: var(--panel);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* ---------- vitals ----------
   300px wide, 4px tall, three segments separated by 2px gaps. The first
   segment is 30% of the bar and is health; the remaining 70% is shield,
   carried across the two segments that follow. */
.vhud-vitals {
  position: absolute;
  top: calc(var(--frame-inset) + 26px);
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
}

.vhud-bar {
  width: 300px;
  height: 4px;
  display: grid;
  /* Exactly 30% of the bar for health, and the 70% that remains for shield,
     carried across two segments. The two 2px gaps come out of the shield
     half so the health segment measures a true 30% of 300px — 90px, 103px,
     103px, with 2px twice between them. */
  grid-template-columns: 30% calc(35% - 2px) calc(35% - 2px);
  gap: 2px;
}

.vhud-seg {
  position: relative;
  height: 4px;
  background: rgba(255, 255, 255, 0.13);
  overflow: hidden;
}
.vhud-seg i {
  position: absolute;
  inset: 0 auto 0 0;
  display: block;
  width: 100%;
  transition: width 0.18s linear;
}
.vhud-seg.health i {
  background: var(--health);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
}
.vhud-seg.shield i {
  background: var(--shield);
  box-shadow: 0 0 8px rgba(79, 225, 213, 0.6);
}

.vhud-vitals-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: var(--track);
  color: rgba(223, 233, 239, 0.62);
}
.vhud-vitals-label b { font-weight: 400; color: var(--shield); }

/* ---------- abilities ----------
   Three 40x40 panels, 1px border, and a 45-degree chamfer on the
   top-right corner cut out of the panel itself. */
.vhud-abilities {
  position: absolute;
  left: calc(var(--frame-inset) + 26px);
  bottom: calc(var(--frame-inset) + 26px);
  display: flex;
  gap: 14px;
  align-items: flex-end;
}

.vhud-ability { display: flex; flex-direction: column; gap: 6px; align-items: center; }

.vhud-slot {
  position: relative;
  width: 40px;
  height: 40px;
  border: 1px solid var(--shield);
  /* the chamfer: a 45-degree cut, 10px along each edge of the top-right */
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.vhud-slot .vhud-glyph {
  font-size: 15px;
  line-height: 1;
  color: var(--shield);
  opacity: 0.9;
}
/* the charge, filling from the bottom */
.vhud-slot .vhud-fill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(79, 225, 213, 0.22);
  transition: height 0.2s linear;
}
.vhud-ability.ready .vhud-slot { box-shadow: 0 0 12px rgba(79, 225, 213, 0.45); }

/* the super, when it is charged, takes the amber */
.vhud-ability.super.ready .vhud-slot {
  border-color: var(--super);
  box-shadow: 0 0 16px rgba(243, 160, 28, 0.55);
}
.vhud-ability.super.ready .vhud-glyph { color: var(--super); }
.vhud-ability.super.ready .vhud-fill { background: rgba(243, 160, 28, 0.28); }
.vhud-ability.super.ready .vhud-label { color: var(--super); }

.vhud-label {
  font-size: 7.5px;
  text-transform: uppercase;
  letter-spacing: var(--track);
  color: rgba(223, 233, 239, 0.55);
  white-space: nowrap;
}

/* ---------- weapon ----------
   Magazine at 3rem in a light weight, reserve at 1.2rem, separated by a
   1px rule leaning 60 degrees off the horizontal. */
.vhud-weapon {
  position: absolute;
  right: calc(var(--frame-inset) + 26px);
  bottom: calc(var(--frame-inset) + 26px);
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding: 10px 16px;
}

.vhud-mag {
  font-size: 3rem;
  font-weight: 300;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
  color: #ffffff;
}

/* 60 degrees from horizontal, drawn as a rotated 1px rule */
.vhud-divider {
  width: 1px;
  height: 46px;
  background: rgba(223, 233, 239, 0.5);
  transform: rotate(30deg);       /* a 1px vertical rule rotated 30deg sits
                                     at 60deg to the horizontal */
  transform-origin: 50% 50%;
  margin: 0 4px 6px;
}

.vhud-reserve {
  font-size: 1.2rem;
  font-weight: 300;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: rgba(223, 233, 239, 0.75);
  padding-bottom: 4px;
}

.vhud-weapon-name {
  position: absolute;
  right: 16px;
  bottom: -14px;
  font-size: 7.5px;
  text-transform: uppercase;
  letter-spacing: var(--track);
  color: rgba(223, 233, 239, 0.5);
  white-space: nowrap;
}

/* ---------- reticle ---------- */
.vhud-reticle {
  position: absolute;
  left: 50%; top: 50%;
  width: 22px; height: 22px;
  transform: translate(-50%, -50%);
}
.vhud-reticle span {
  position: absolute;
  background: rgba(255, 255, 255, 0.85);
}
.vhud-reticle span:nth-child(1) { left: 50%; top: 0; width: 1px; height: 6px; margin-left: -0.5px; }
.vhud-reticle span:nth-child(2) { left: 50%; bottom: 0; width: 1px; height: 6px; margin-left: -0.5px; }
.vhud-reticle span:nth-child(3) { top: 50%; left: 0; height: 1px; width: 6px; margin-top: -0.5px; }
.vhud-reticle span:nth-child(4) { top: 50%; right: 0; height: 1px; width: 6px; margin-top: -0.5px; }


/* ============================================================
   The page around it. Deliberately single-theme: this is a heads-up
   display, and a display is only ever read against the dark. Every
   colour is painted explicitly so the page holds on either host ground.
   ============================================================ */
:root {
  --ground:   #05080D;   /* near-black, biased blue toward the accent */
  --surface:  rgba(8, 13, 19, 0.86);
  --ink:      #CFE3EE;
  --ink-dim:  rgba(207, 227, 238, 0.58);
  --rule:     rgba(79, 225, 213, 0.22);
  --accent:   #4FE1D5;
  --amber:    #F3A01C;
}

* { box-sizing: border-box; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: 'Chakra Petch', system-ui, sans-serif;
  overflow: hidden;
}

/* The stage stands in for a game scene: something with depth and
   detail behind the panels, so the backdrop blur has work to do. */
#stage {
  position: fixed; inset: 0;
  background:
    radial-gradient(900px 620px at 64% 36%, #1B3550 0%, transparent 62%),
    radial-gradient(720px 520px at 18% 80%, #3A1F36 0%, transparent 60%),
    repeating-linear-gradient(115deg, #0A1018 0 26px, #0D141D 26px 52px),
    var(--ground);
}
#stage::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(120, 180, 220, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 180, 220, 0.05) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ---- the inspector ----
   Docked left, clear of the component: the point of the page is the
   thing behind it, so the controls never sit over the reticle. */
#panel {
  position: fixed;
  top: 50%; left: 44px;
  transform: translateY(-50%);
  width: min(340px, calc(100vw - 88px));
  max-height: calc(100vh - 88px);
  overflow-y: auto;
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--rule);
  padding: 20px 22px;
  z-index: 40;
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s;
}
#panel.stowed {
  transform: translateY(-50%) translateX(calc(-100% - 48px));
  opacity: 0;
  pointer-events: none;
}

#panel h1 {
  margin: 0 0 3px;
  font-size: 15px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent);
  text-wrap: balance;
}
#panel .sub {
  margin: 0 0 18px;
  font-family: 'Share Tech Mono', ui-monospace, monospace;
  font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ink-dim);
}

.controls { display: flex; flex-direction: column; gap: 9px; }
.row {
  display: grid;
  grid-template-columns: 76px 1fr 34px;
  gap: 10px; align-items: center;
}
.row label {
  font-family: 'Share Tech Mono', ui-monospace, monospace;
  font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ink-dim);
}
.row output {
  font-family: 'Share Tech Mono', ui-monospace, monospace;
  font-size: 11px; text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.row.super output { color: var(--amber); }

input[type=range] {
  width: 100%; accent-color: var(--accent);
  background: transparent;
}
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.row.super input[type=range] { accent-color: var(--amber); }

.btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
button {
  font-family: 'Share Tech Mono', ui-monospace, monospace;
  font-size: 9.5px; letter-spacing: 0.16em;
  padding: 7px 11px;
  background: transparent; color: var(--accent);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
button:hover { background: rgba(79, 225, 213, 0.14); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.amber { color: var(--amber); border-color: rgba(243, 160, 28, 0.4); }
button.amber:hover { background: rgba(243, 160, 28, 0.14); border-color: var(--amber); }

/* The spec sheet: the brief's own measurements, as content. */
#spec {
  margin-top: 18px; padding-top: 14px;
  border-top: 1px solid var(--rule);
  display: grid; gap: 5px;
  font-family: 'Share Tech Mono', ui-monospace, monospace;
  font-size: 9.5px; line-height: 1.7; letter-spacing: 0.05em;
  color: rgba(207, 227, 238, 0.46);
}
#spec div { display: grid; grid-template-columns: 68px 1fr; gap: 10px; }
#spec span { color: var(--accent); }
#spec b { color: rgba(207, 227, 238, 0.86); font-weight: 400; }

/* the handle that brings the panel back */
#restore {
  position: fixed; top: 50%; left: 22px;
  transform: translateY(-50%);
  z-index: 41;
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s;
  writing-mode: vertical-rl;
  letter-spacing: 0.24em;
  padding: 14px 7px;
}
#restore.shown { opacity: 1; pointer-events: auto; }

@media (prefers-reduced-motion: reduce) {
  #panel, #restore, .vhud-seg i, .vhud-slot .vhud-fill { transition: none; }
}

@media (max-width: 720px) {
  #panel { left: 20px; right: 20px; width: auto; }
}
</style>

<div id="stage"></div>
<div id="hud-host"></div>

<button id="restore" aria-label="Show the inspector">INSPECTOR</button>

<section id="panel" aria-label="HUD inspector">
  <h1>Vanguard HUD</h1>
  <p class="sub">Live component &middot; every measurement fixed by spec</p>

  <div class="controls">
    <div class="row">
      <label for="health">Health</label>
      <input id="health" type="range" min="0" max="100" value="100">
      <output id="health-o" for="health">100</output>
    </div>
    <div class="row">
      <label for="shield">Shield</label>
      <input id="shield" type="range" min="0" max="100" value="100">
      <output id="shield-o" for="shield">100</output>
    </div>
    <div class="row">
      <label for="grenade">Grenade</label>
      <input id="grenade" type="range" min="0" max="100" value="100">
      <output id="grenade-o" for="grenade">100</output>
    </div>
    <div class="row">
      <label for="melee">Melee</label>
      <input id="melee" type="range" min="0" max="100" value="100">
      <output id="melee-o" for="melee">100</output>
    </div>
    <div class="row super">
      <label for="super">Super</label>
      <input id="super" type="range" min="0" max="100" value="100">
      <output id="super-o" for="super">100</output>
    </div>
    <div class="row">
      <label for="mag">Magazine</label>
      <input id="mag" type="range" min="0" max="60" value="24">
      <output id="mag-o" for="mag">24</output>
    </div>
  </div>

  <div class="btns">
    <button id="btn-hit">TAKE A HIT</button>
    <button id="btn-fire">FIRE A BURST</button>
    <button class="amber" id="btn-super">SPEND THE SUPER</button>
    <button id="btn-stow">STOW</button>
  </div>

  <div id="spec">
    <div><span>VITALS</span><b>300 &times; 4</b> &middot; three segments &middot; 2px gaps &middot; 30 / 70</div>
    <div><span>ABILITY</span><b>40 &times; 40</b> &middot; 1px border &middot; 45&deg; chamfer</div>
    <div><span>WEAPON</span><b>3rem</b> magazine &middot; 1.2rem reserve &middot; 60&deg; rule</div>
    <div><span>FRAME</span>1px &middot; <b>20px</b> inset &middot; labels tracked 0.15em</div>
  </div>
</section>

<script>
/* ============================================================
   The component's module, verbatim from src/js/fps/d2hud.js.
   ============================================================ */
/* ============================================================
   VANGUARD HUD — the component's markup and its data binding.

   One call builds the whole readout into a host element and hands back
   a small API: set the vitals, set an ability's charge, set the ammo.
   Nothing here reads the game directly, so the same component drives
   the live HUD and the preview page.
   ============================================================ */
(function (SF) {
  'use strict';

  const ABILITIES = [
    { id: 'grenade', label: 'GRENADE', glyph: '◈' },
    { id: 'melee',   label: 'MELEE',   glyph: '✦' },
    { id: 'super',   label: 'SUPER',   glyph: '◆', super: true }
  ];

  const clamp01 = (v) => Math.max(0, Math.min(1, v || 0));

  function create(host, opts) {
    const o = opts || {};
    const root = document.createElement('div');
    root.className = 'vhud';

    root.innerHTML =
      '<div class="vhud-frame"></div>' +

      '<div class="vhud-vitals">' +
        '<div class="vhud-vitals-label"><span data-name>GUARDIAN</span>' +
        '<span><b data-shieldpct>100</b> SHIELD</span></div>' +
        /* Three segments, 2px apart. The first is 30% of the bar and is
           health; the two after it carry the 70% that is shield. */
        '<div class="vhud-bar">' +
          '<div class="vhud-seg health"><i data-health></i></div>' +
          '<div class="vhud-seg shield"><i data-shield-a></i></div>' +
          '<div class="vhud-seg shield"><i data-shield-b></i></div>' +
        '</div>' +
      '</div>' +

      '<div class="vhud-abilities">' +
        ABILITIES.map((a) =>
          `<div class="vhud-ability${a.super ? ' super' : ''}" data-ability="${a.id}">` +
            '<div class="vhud-slot">' +
              '<div class="vhud-fill"></div>' +
              `<span class="vhud-glyph">${a.glyph}</span>` +
            '</div>' +
            `<div class="vhud-label">${a.label}</div>` +
          '</div>').join('') +
      '</div>' +

      '<div class="vhud-weapon vhud-panel">' +
        '<span class="vhud-mag" data-mag>24</span>' +
        '<span class="vhud-divider"></span>' +
        '<span class="vhud-reserve" data-reserve>168</span>' +
        '<span class="vhud-weapon-name" data-weapon>ARC LANCE</span>' +
      '</div>' +

      '<div class="vhud-reticle"><span></span><span></span><span></span><span></span></div>';

    host.appendChild(root);

    const q = (sel) => root.querySelector(sel);
    const els = {
      health: q('[data-health]'),
      shieldA: q('[data-shield-a]'),
      shieldB: q('[data-shield-b]'),
      shieldPct: q('[data-shieldpct]'),
      name: q('[data-name]'),
      mag: q('[data-mag]'),
      reserve: q('[data-reserve]'),
      weapon: q('[data-weapon]')
    };
    const abilities = {};
    for (const a of ABILITIES) {
      const node = root.querySelector('[data-ability="' + a.id + '"]');
      abilities[a.id] = { node: node, fill: node.querySelector('.vhud-fill') };
    }

    /* Health is the first 30% of the bar, shield the remaining 70% across
       two segments — so a shield at half full drains the far segment first
       and then the near one, the way a two-stage bar should read. */
    function vitals(healthFrac, shieldFrac) {
      const h = clamp01(healthFrac), s = clamp01(shieldFrac);
      els.health.style.width = (h * 100) + '%';
      els.shieldA.style.width = (clamp01(s * 2) * 100) + '%';
      els.shieldB.style.width = (clamp01(s * 2 - 1) * 100) + '%';
      els.shieldPct.textContent = Math.round(s * 100);
    }

    function ability(id, charge, ready) {
      const a = abilities[id];
      if (!a) return;
      a.fill.style.height = (clamp01(charge) * 100) + '%';
      a.node.classList.toggle('ready', ready === undefined ? charge >= 1 : !!ready);
    }

    function ammo(mag, reserve) {
      els.mag.textContent = mag;
      els.reserve.textContent = reserve;
    }

    const setName = (v) => { els.name.textContent = v; };
    const setWeapon = (v) => { els.weapon.textContent = v; };

    vitals(o.health == null ? 1 : o.health, o.shield == null ? 1 : o.shield);
    for (const a of ABILITIES) ability(a.id, 1, true);

    return {
      root, vitals, ability, ammo, setName, setWeapon,
      destroy() { root.remove(); },
      get abilities() { return ABILITIES.slice(); }
    };
  }

  SF.d2hud = { create, ABILITIES };
})(window.SF = window.SF || {});

</script>

<script>
(function () {
  'use strict';

  var hud = SF.d2hud.create(document.getElementById('hud-host'));
  hud.setName('VEER-7');
  hud.setWeapon('ARC LANCE');

  var state = { health: 1, shield: 1, grenade: 1, melee: 1, super: 1, mag: 24, reserve: 168 };

  function paint() {
    hud.vitals(state.health, state.shield);
    hud.ability('grenade', state.grenade);
    hud.ability('melee', state.melee);
    hud.ability('super', state.super);
    hud.ammo(state.mag, state.reserve);
  }

  var sliders = {};
  ['health', 'shield', 'grenade', 'melee', 'super', 'mag'].forEach(function (key) {
    var el = document.getElementById(key);
    var out = document.getElementById(key + '-o');
    var scale = key === 'mag' ? 1 : 100;
    sliders[key] = el;
    el.addEventListener('input', function () {
      state[key] = +el.value / scale;
      out.textContent = el.value;
      paint();
    });
  });

  function sync() {
    Object.keys(sliders).forEach(function (key) {
      var scale = key === 'mag' ? 1 : 100;
      sliders[key].value = Math.round(state[key] * scale);
      document.getElementById(key + '-o').textContent = sliders[key].value;
    });
  }

  document.getElementById('btn-hit').addEventListener('click', function () {
    if (state.shield > 0) state.shield = Math.max(0, state.shield - 0.34);
    else state.health = Math.max(0, state.health - 0.25);
    sync(); paint();
  });

  document.getElementById('btn-fire').addEventListener('click', function () {
    state.mag = Math.max(0, state.mag - 6);
    sync(); paint();
  });

  document.getElementById('btn-super').addEventListener('click', function () {
    state.super = state.super >= 1 ? 0 : 1;
    sync(); paint();
  });

  var panel = document.getElementById('panel');
  var restore = document.getElementById('restore');
  document.getElementById('btn-stow').addEventListener('click', function () {
    panel.classList.add('stowed');
    restore.classList.add('shown');
    restore.focus();
  });
  restore.addEventListener('click', function () {
    panel.classList.remove('stowed');
    restore.classList.remove('shown');
  });

  paint();
